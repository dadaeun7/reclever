# server.forward-headers-strategy=framework

# #google Oauth 토큰 저장 로컬 폴더 경로
google.credentials.folder=tokens

# secret
jwt.secret=${JWT_SECRET}
spring.ase.secret-key=${SPRING_SECRET_KEY}

# db
spring.r2dbc.host=${POSTGRES_HOST}
spring.r2dbc.port=5432
spring.r2dbc.database=${POSTGRES_DB}
spring.r2dbc.url=r2dbc:postgresql://postgresql:5432/reclever
spring.r2dbc.username=${POSTGRES_USER}
spring.r2dbc.password=${POSTGRES_PASSWORD}

#jpa logging
spring.jpa.show-sql=true

# redis
spring.data.redis.host=inmemory
spring.data.redis.port=6380

# logging
logging.level.org.springframework.r2dbc=DEBUG

# oauth2 logout 후 리다이렉트 url 설정
app.oauth.logout-redirect-uri="https://localhost:3000/reclever"

# http & cross domain
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=None

# 디버그 
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.root=INFO
logging.level.com.server.back.infrastructure=DEBUG

# record int 설정
app.status=1

# multpart 설정
spring.servlet.multpart.location=/tmp/spring-multipart-temp
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.file-size-threshold=2MB

#http
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

#logging
logging.level.org.springframework.data.redis=DEBUG
logging.level.io.lettuce.core=DEBUG

# google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/gmail.readonly
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8083/login/oauth2/code/google
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.client-name=Google

# [핵심] 리프레시 토큰을 받기 위한 필수 설정
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent